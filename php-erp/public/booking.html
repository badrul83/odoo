<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="erp-base-path" content="@@ERP_BASE_PATH@@">
    <title>Book an Appointment</title>
    <style>
        :root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#263238;background:#f5f7f8;font-size:15px}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:34px 16px}.booking-card{width:min(680px,100%);margin:0 auto;background:#fff;border:1px solid #d9e0e3;border-radius:12px;box-shadow:0 10px 34px #1a303611;overflow:hidden}.booking-head{padding:28px 32px 22px;border-bottom:1px solid #e4e9eb}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;color:#087e78}.booking-head h1{font-size:26px;margin:8px 0 7px}.booking-head p{color:#63747a;line-height:1.5;margin:0}.booking-form{padding:24px 32px 30px;display:grid;gap:16px}.manage-form{padding:0}.booking-form label{display:grid;gap:7px;font-weight:600}.booking-form input,.booking-form select,.booking-form textarea{width:100%;min-height:42px;border:1px solid #cbd5d9;border-radius:6px;padding:9px 11px;color:inherit;background:white;font:inherit}.booking-form input:focus,.booking-form select:focus,.booking-form textarea:focus{outline:2px solid #79c9c4;border-color:#118b83}.booking-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.booking-questions{display:grid;gap:14px}.booking-message{padding:11px 13px;border-radius:7px;background:#edf7f6;color:#145f5b;line-height:1.5}.booking-error{padding:11px 13px;border-radius:7px;background:#fff0ef;color:#a5362a}.booking-error:empty,.booking-message:empty{display:none}.button{border:1px solid #cbd5d9;border-radius:6px;background:white;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}.button-primary{background:#087e78;border-color:#087e78;color:white}.button:disabled{opacity:.6;cursor:wait}.small{font-size:13px;color:#63747a;font-weight:400}.honeypot{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}.loading{padding:35px;color:#63747a;text-align:center}@media(max-width:560px){body{padding:12px}.booking-head{padding:22px 20px 18px}.booking-form{padding:18px 20px 22px}.manage-form{padding:0}.booking-grid{grid-template-columns:1fr}}
    </style>
    <script src="@@ERP_BASE_PATH@@/booking.js" defer></script>
</head>
<body>
    <main id="booking-card" class="booking-card"><div class="loading">Loading appointment details…</div></main>
</body>
</html>
